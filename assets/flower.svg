    <ellipse rx="1.6" ry="6.8" cy="-7.6" transform="rotate(88)"/>
    <ellipse rx="1.4" ry="5.2" cy="-6.2" transform="rotate(128)"/>
    <ellipse rx="1.6" ry="6.4" cy="-7.2" transform="rotate(171)"/>
    <ellipse rx="1.5" ry="5.8" cy="-6.8" transform="rotate(217)"/>
    <ellipse rx="1.7" ry="7.0" cy="-7.9" transform="rotate(262)"/>
    <ellipse rx="1.4" ry="5.4" cy="-6.4" transform="rotate(309)"/>
