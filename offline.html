<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tanawin — no connection</title>
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
           background: #FBF6EF; color: #4A3B33; font-family: system-ui, sans-serif; padding: 24px; }
    .card { max-width: 340px; text-align: center; }
    h1 { font-size: 20px; color: #933212; margin: 0 0 10px; }
    p { font-size: 15px; line-height: 1.5; color: #6B5B52; margin: 0 0 18px; }
    button { border: none; background: #933212; color: #FBF6EF; font-size: 15px; font-weight: 700;
             border-radius: 12px; padding: 13px 22px; cursor: pointer; font-family: inherit; }
  </style>
</head>
<body>
  <div class="card">
    <h1>No connection</h1>
    <p>The dashboard needs internet to load orders. Check the WiFi or mobile data, then try again.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
