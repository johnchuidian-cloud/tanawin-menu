<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tanawin — no connection</title>
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
           background: #FBF6EF; color: #4A3B33; font-family: system-ui, sans-serif; padding: 24px; }
    .card { max-width: 340px; text-align: center; }
    h1 { font-size: 20px; color: #933212; margin: 0 0 10px; }
    p { font-size: 15px; line-height: 1.5; color: #6B5B52; margin: 0 0 18px; }
    a { display: inline-block; text-decoration: none; background: #933212; color: #FBF6EF;
        font-size: 15px; font-weight: 700; border-radius: 12px; padding: 13px 22px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>No connection</h1>
    <p>The dashboard needs internet to load orders. Check the WiFi or mobile data, then try again.</p>
    <!-- Empty href = this exact URL. sw.js answers ANY failed navigation with
         this page and respondWith leaves the address bar on the page the person
         actually asked for, so this retries that page — the guest menu for a
         guest, the dashboard for staff. A literal /staff here (as it briefly was)
         sends an offline guest to the staff login. It stays a link rather than a
         button because a button needs script, and script-src carries no
         'unsafe-inline'; a cached page could not load an external file anyway. -->
    <a href="">Try again</a>
  </div>
</body>
</html>
